<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>HoYoPass</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: sans-serif; width: 340px; margin: 0; padding: 12px; font-size: 13px;
         background: #0d1321; color: #e8edf7; }
  h1 { font-size: 15px; margin: 0 0 4px; color: #ffffff; }
  h1 small { color: #8fa3c8; font-weight: normal; }
  .sub { color: #8fa3c8; margin-bottom: 10px; }
  .game { background: #16203a; border: 1px solid #2a3a5f; border-radius: 8px;
          padding: 8px 10px; margin-bottom: 8px; }
  .game h2 { font-size: 13px; margin: 0 0 6px; display: flex; justify-content: space-between; color: #ffffff; }
  .game h2 .count { color: #8fa3c8; font-weight: normal; }
  .row { display: flex; gap: 12px; margin-bottom: 4px; }
  .status { color: #b9c6de; white-space: pre-line; }
  button { width: 100%; padding: 8px; margin: 6px 0; cursor: pointer;
           background: #2f6fed; color: #ffffff; border: 1px solid #2f6fed; border-radius: 8px; }
  button:hover { background: #3b7bff; }
  button:disabled { background: #24365e; border-color: #24365e; color: #8fa3c8; cursor: default; }
  .footer { color: #8fa3c8; margin-top: 8px; white-space: pre-line; }
  label { cursor: pointer; }
  input[type="checkbox"] { accent-color: #5b8cff; }
</style>
</head>
<body>
  <h1>HoYoPass <small>(非公式・Firefox版)</small></h1>
  <div class="sub">デイリーログインボーナスと交換コードを自動で受け取ります。</div>
  <div id="games"></div>
  <button id="run-now">今すぐ実行（チェックイン＋コード）</button>
  <div class="footer" id="footer"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
