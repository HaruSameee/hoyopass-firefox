<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>HoYoPass</title>
<style>
  body { font-family: sans-serif; width: 340px; margin: 0; padding: 12px; font-size: 13px; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  .sub { color: #666; margin-bottom: 10px; }
  .game { border: 1px solid #ccc; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
  .game h2 { font-size: 13px; margin: 0 0 6px; display: flex; justify-content: space-between; }
  .game h2 .count { color: #666; font-weight: normal; }
  .row { display: flex; gap: 12px; margin-bottom: 4px; }
  .status { color: #444; white-space: pre-line; }
  button { width: 100%; padding: 8px; margin: 6px 0; cursor: pointer; }
  .footer { color: #666; margin-top: 8px; white-space: pre-line; }
  label { cursor: pointer; }
</style>
</head>
<body>
  <h1>HoYoPass <small>(非公式・Firefox版)</small></h1>
  <div class="sub">デイリーログインボーナスと交換コードを自動で受け取ります。</div>
  <div id="games"></div>
  <button id="run-now">今すぐ実行（チェックイン＋コード）</button>
  <div class="footer" id="footer"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
